<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}"></head>

<body class="bg-light d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">

    <div th:replace="~{fragments/layout :: alertas}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0" th:text="${titulo}">Carros</h1>
        <a class="btn btn-success" th:href="@{/carros/nuevo}">Nuevo carro</a>
    </div>

    <form class="row g-2 mb-3" method="get" th:action="@{/carros}">
        <div class="col-sm-8 col-md-6">
            <input type="text" class="form-control" name="q" th:value="${q}"
                   placeholder="Buscar por placa o marca">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-secondary">Buscar</button>
        </div>
        <div class="col-auto">
            <a class="btn btn-outline-secondary" th:href="@{/carros}">Limpiar</a>
        </div>
    </form>

    <div th:if="${#lists.isEmpty(carros)}" class="alert alert-info">No hay registros para mostrar.</div>

    <div th:unless="${#lists.isEmpty(carros)}" class="table-responsive bg-white rounded shadow-sm">
        <table class="table table-striped table-hover align-middle mb-0">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Placa</th>
                <th>Marca</th>
                <th>Modelo</th>
                <th>Año</th>
                <th>Color</th>
                <th>Precio por día</th>
                <th>Estado</th>
                <th class="text-end">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${carros}">
                <td th:text="${c.id}">1</td>
                <td class="fw-semibold" th:text="${c.placa}">ABC123</td>
                <td th:text="${c.marca}">Marca</td>
                <td th:text="${c.modelo}">Modelo</td>
                <td th:text="${c.anio}">2020</td>
                <td th:text="${c.color}">Color</td>
                <td th:text="${#numbers.formatDecimal(c.precioDia, 1, 'POINT', 2, 'COMMA')}">0,00</td>
                <td>
                    <span th:if="${c.disponible}" class="badge text-bg-success">Disponible</span>
                    <span th:unless="${c.disponible}" class="badge text-bg-secondary">No disponible</span>
                </td>
                <td class="text-end text-nowrap">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/carros/{id}(id=${c.id})}">Ver</a>
                    <a class="btn btn-sm btn-outline-warning" th:href="@{/carros/{id}/editar(id=${c.id})}">Editar</a>
                    <form class="d-inline" method="post" th:action="@{/carros/{id}/eliminar(id=${c.id})}">
                        <button type="submit" class="btn btn-sm btn-outline-danger"
                                onclick="return confirm('¿Confirma que desea eliminar este carro?')">Eliminar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
