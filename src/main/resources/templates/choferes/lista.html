<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}"></head>

<body class="bg-light d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">

    <div th:replace="~{fragments/layout :: alertas}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0" th:text="${titulo}">Choferes</h1>
        <a class="btn btn-warning" th:href="@{/choferes/nuevo}">Nuevo chofer</a>
    </div>

    <form class="row g-2 mb-3" method="get" th:action="@{/choferes}">
        <div class="col-sm-8 col-md-6">
            <input type="text" class="form-control" name="q" th:value="${q}"
                   placeholder="Buscar por nombres o documento">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-secondary">Buscar</button>
        </div>
        <div class="col-auto">
            <a class="btn btn-outline-secondary" th:href="@{/choferes}">Limpiar</a>
        </div>
    </form>

    <div th:if="${#lists.isEmpty(choferes)}" class="alert alert-info">No hay registros para mostrar.</div>

    <div th:unless="${#lists.isEmpty(choferes)}" class="table-responsive bg-white rounded shadow-sm">
        <table class="table table-striped table-hover align-middle mb-0">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nombres</th>
                <th>Apellidos</th>
                <th>Documento</th>
                <th>Licencia</th>
                <th>Categoría</th>
                <th>Vence</th>
                <th>Estado</th>
                <th class="text-end">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="ch : ${choferes}">
                <td th:text="${ch.id}">1</td>
                <td th:text="${ch.nombres}">Nombres</td>
                <td th:text="${ch.apellidos}">Apellidos</td>
                <td th:text="${ch.documento}">1020304050</td>
                <td th:text="${ch.numeroLicencia}">LIC-000</td>
                <td th:text="${ch.categoriaLicencia}">C1</td>
                <td th:text="${ch.fechaVencimientoLicencia}">2027-01-01</td>
                <td>
                    <span th:if="${ch.activo}" class="badge text-bg-success">Activo</span>
                    <span th:unless="${ch.activo}" class="badge text-bg-secondary">Inactivo</span>
                </td>
                <td class="text-end text-nowrap">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/choferes/{id}(id=${ch.id})}">Ver</a>
                    <a class="btn btn-sm btn-outline-warning" th:href="@{/choferes/{id}/editar(id=${ch.id})}">Editar</a>
                    <form class="d-inline" method="post" th:action="@{/choferes/{id}/eliminar(id=${ch.id})}">
                        <button type="submit" class="btn btn-sm btn-outline-danger"
                                onclick="return confirm('¿Confirma que desea eliminar este chofer?')">Eliminar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
