<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}"></head>

<body class="bg-light d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">

    <div th:replace="~{fragments/layout :: alertas}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0" th:text="${titulo}">Usuarios</h1>
        <a class="btn btn-primary" th:href="@{/usuarios/nuevo}">Nuevo usuario</a>
    </div>

    <form class="row g-2 mb-3" method="get" th:action="@{/usuarios}">
        <div class="col-sm-8 col-md-6">
            <input type="text" class="form-control" name="q" th:value="${q}"
                   placeholder="Buscar por nombres o apellidos">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-secondary">Buscar</button>
        </div>
        <div class="col-auto">
            <a class="btn btn-outline-secondary" th:href="@{/usuarios}">Limpiar</a>
        </div>
    </form>

    <div th:if="${#lists.isEmpty(usuarios)}" class="alert alert-info">No hay registros para mostrar.</div>

    <div th:unless="${#lists.isEmpty(usuarios)}" class="table-responsive bg-white rounded shadow-sm">
        <table class="table table-striped table-hover align-middle mb-0">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nombres</th>
                <th>Apellidos</th>
                <th>Correo</th>
                <th>Teléfono</th>
                <th>Estado</th>
                <th class="text-end">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${usuarios}">
                <td th:text="${u.id}">1</td>
                <td th:text="${u.nombres}">Nombres</td>
                <td th:text="${u.apellidos}">Apellidos</td>
                <td th:text="${u.email}">correo@ejemplo.com</td>
                <td th:text="${u.telefono}">3001234567</td>
                <td>
                    <span th:if="${u.activo}" class="badge text-bg-success">Activo</span>
                    <span th:unless="${u.activo}" class="badge text-bg-secondary">Inactivo</span>
                </td>
                <td class="text-end text-nowrap">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/usuarios/{id}(id=${u.id})}">Ver</a>
                    <a class="btn btn-sm btn-outline-warning" th:href="@{/usuarios/{id}/editar(id=${u.id})}">Editar</a>
                    <form class="d-inline" method="post" th:action="@{/usuarios/{id}/eliminar(id=${u.id})}">
                        <button type="submit" class="btn btn-sm btn-outline-danger"
                                onclick="return confirm('¿Confirma que desea eliminar este usuario?')">Eliminar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
